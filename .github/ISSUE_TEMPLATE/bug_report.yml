name: Bug report
description: Something in Randnotiz doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! English or German are both fine.

        **Please never attach private photos, real diary entries or backup passwords.**
        Describe what you see instead, or reproduce it with test photos.
        Security problems belong in a [private report](https://github.com/tjorvez/randnotiz/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. …
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → "About Randnotiz"
      placeholder: e.g. 1.3.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 16
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Deutsch
        - Français
        - Español
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: My report contains no private photos, real diary entries or passwords.
          required: true
