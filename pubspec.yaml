name: randnotiz
description: "Randnotiz – a private photo diary for Android."
homepage: https://randnotiz.info
repository: https://github.com/tjorvez/randnotiz
# An app, not a package: never published to pub.dev.
publish_to: 'none'

# versionName+versionCode for Android. The number after "+" must grow with
# every release uploaded to Google Play.
version: 1.3.0+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  local_auth: ^3.0.2
  speech_to_text: ^7.5.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  home_widget: ^0.10.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  emoji_picker_flutter: ^4.5.4
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.8
  google_sign_in_platform_interface: ^3.1.0
  url_launcher: ^6.3.3
  just_audio: ^0.10.6
  sqlite3: ^3.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/icon_512.png
    - assets/branding/apple_music_badge_de.png
    - assets/branding/apple_music_badge_en.png
    - assets/branding/apple_music_badge_fr.png
    - assets/branding/apple_music_badge_es.png
    - assets/map/land.bin
    - assets/geo/countries.bin
    - assets/geo/places.bin
    - assets/fonts/OFL-kalam.txt
    - assets/fonts/OFL-crimsontext.txt

  fonts:
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CrimsonText-Italic.ttf
          style: italic

# Notes are stored encrypted (lib/core/database/database_encryption.dart):
# SQLite3MultipleCiphers instead of plain SQLite. Same API, plus PRAGMA key.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
