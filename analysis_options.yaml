include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - lib/l10n/generated/**
    - test/core/database/app_database/generated/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_const_constructors
    - avoid_print
    - unawaited_futures
    - always_declare_return_types
    - directives_ordering
    - sort_child_properties_last
    - use_super_parameters
